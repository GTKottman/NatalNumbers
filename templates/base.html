<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Natal Numbers — The Math Behind You{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  {% block head %}{% endblock %}
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
          <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" stroke="#1a4fd6" stroke-width="1.6" fill="none"/>
          <polygon points="20,9 30,14.5 30,25.5 20,31 10,25.5 10,14.5" stroke="#1a4fd6" stroke-width="1" fill="none" opacity="0.45"/>
          <circle cx="20" cy="20" r="3.5" fill="#1a4fd6"/>
          <line x1="20" y1="3" x2="20" y2="37" stroke="#1a4fd6" stroke-width="0.7" opacity="0.3"/>
          <line x1="5" y1="11.5" x2="35" y2="28.5" stroke="#1a4fd6" stroke-width="0.7" opacity="0.3"/>
          <line x1="35" y1="11.5" x2="5" y2="28.5" stroke="#1a4fd6" stroke-width="0.7" opacity="0.3"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Natal Numbers</span>
        <span class="brand-sub">THE MATH BEHIND YOU</span>
      </span>
    </a>

    <ul class="nav-links">
      <li><a href="/#how-it-works">How It Works</a></li>
      <li><a href="/#planet-math">Planet Math</a></li>
      <li><a href="/#sample">Report Sample</a></li>
      <li><a href="/#about">About</a></li>
    </ul>

    <a href="/#get-chart" class="btn btn-primary nav-cta">Get Your Chart</a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-brand">Natal Numbers</span>
      <span class="footer-sep">·</span>
      <span class="footer-tagline">Birth data → UTC → Julian Day → ecliptic longitude → 30° sector.</span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
